name: Build Cosmos Site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install
      - run: bun run build:site
